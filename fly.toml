# fly.toml app configuration file generated for linkapp2 on 2026-11-13T14:36:51Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'linkapp2'
primary_region = 'ams'

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'stop'
  force_https = true
  internal_port = 3000
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 2048
